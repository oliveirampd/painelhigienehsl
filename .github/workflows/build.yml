name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test predictions CSV parser
        run: node tests/predictions.test.mjs
      - name: Test priority XLS parser
        run: node tests/predictions-xls.test.mjs
      - name: Test Listo sync safeguards
        run: node tests/listo-sync-safety.test.mjs
      - name: Build
        run: bun run build
      - name: Validate Terminal sync Durable Object bundle
        run: |
          grep -q "TerminalSyncDurableObject" .output/server/index.mjs
          grep -q "TERMINAL_SYNC_DO" .output/server/wrangler.json
          grep -q "TerminalSyncDurableObject" .output/server/wrangler.json
