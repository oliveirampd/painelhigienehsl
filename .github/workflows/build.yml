name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test predictions CSV parser
        run: node tests/predictions.test.mjs
      - name: Test priority XLS parser
        run: node tests/predictions-xls.test.mjs
      - name: Test Listo sync safeguards
        run: node tests/listo-sync-safety.test.mjs
      - name: Test daily aggregation
        run: node tests/daily-aggregation.test.mjs
      - name: Test paginated load
        run: node tests/fetch-pages.test.mjs
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
      - name: Validate Terminal sync Durable Object bundle
        run: |
          grep -q "TerminalSyncDurableObject" .output/server/index.mjs || { echo "DO class missing from server bundle"; exit 1; }
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync(".output/server/wrangler.json","utf8")); console.log(JSON.stringify({durable_objects:c.durable_objects,exports:c.exports,migrations:c.migrations})); if(!c.durable_objects?.bindings?.some(b=>b.name==="TERMINAL_SYNC_DO"&&b.class_name==="TerminalSyncDurableObject")) throw new Error("DO binding missing from generated Wrangler config"); if(!c.exports?.TerminalSyncDurableObject) throw new Error("DO export missing from generated Wrangler config");'
